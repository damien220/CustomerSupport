[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-support-faq"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # MCP protocol layer — FastMCP API; mcp 2.x renamed FastMCP -> MCPServer.
    "mcp>=1.10,<2",
    # Core web
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.6",
    "pydantic-settings",
    "httpx>=0.27.0",
    # LLM
    "anthropic",
    # Scheduling
    "apscheduler==4.0.0a6",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    # Retrieval — dense vectors inside SQLite (BM25 uses the built-in FTS5)
    "sqlite-vec>=0.1.6,<0.2",
    # Observability
    "langfuse",
    # Remote-access security — JWT access-token verification (already pulled in by mcp)
    "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
# Heavy / torch-based — local embeddings + BGE reranker, dev UI, eval gate;
# see requirements-rag.txt.
rag = [
    "sentence-transformers",
    "gradio",
    # RAGAS gate — exact pins and reasons in requirements-rag.txt.
    "ragas==0.4.3",
    "datasets==5.1.0",
    "instructor==1.17.0",
    "openai==3.3.0",
    "langchain==1.4.7",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langchain-community==0.4.1",
]
# Lite dev/test tooling; see requirements-dev.txt.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
faq-assistant = "app:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "S", "ANN"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Generic tracing decorator passthrough — deliberately untyped *args/**kwargs.
"observability/tracing.py" = ["ANN401"]
# gradio ships no type stubs; build_demo returns gr.ChatInterface (Any) and the
# real types return once the UI stack is installed.
"ui/gradio_app.py" = ["ANN401"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "rag: requires the heavy eval stack (requirements-rag.txt) or a live LLM key — excluded from lite test runs",
]
filterwarnings = [
    # pydantic-settings' secrets_dir="/run/secrets" only exists under k8s/Docker
    # secrets mounts; harmless in local dev/test.
    'ignore:directory "/run/secrets" does not exist:UserWarning',
]
